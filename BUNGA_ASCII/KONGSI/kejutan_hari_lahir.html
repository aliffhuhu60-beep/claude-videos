<script>
/*
  Selamat Hari Lahir — kek ASCII 3D, lilin menyala, tulisan "Selamat Hari Lahir",
  kemudian kek bertukar menjadi kilauan dan jambangan bunga tumbuh & mekar.

  Pilihan URL:
    hari_lahir.html?nama=Aisyah            tambah nama di bawah "Selamat Hari Lahir"
    hari_lahir.html?ayat=Teks%20sendiri    tukar ayat yang muncul bersama bunga (guna | untuk baris baru)
    hari_lahir.html?msg=untuk%20awak       pesanan kecil di bawah jambangan
  Ketik dua kali untuk main semula.
*/
"use strict";
const MESSAGE = new URLSearchParams(location.search).get("msg") || "bunga ini khas untuk awak <3";
const QS = new URLSearchParams(location.search);
const WALL = false, CAPTURE = QS.has("capture");
// nama: ?nama=Aisyah atau #Aisyah (pautan kongsi hanya membawa #)
const HASH_NAMA = decodeURIComponent(location.hash.slice(1)).replace(/[-_]+/g, " ").trim();
const NAMA = ((QS.get("nama") || "").trim() || HASH_NAMA).slice(0, 24), MSG_ON = QS.has("msg");
// ayat lembut yang muncul bersama bunga (bukan gaya tulisan "Selamat Hari Lahir")
const AYAT = (QS.get("ayat") || "Semoga setiap harimu|mekar seindah bunga ini").split("|").map(l => l.trim()).filter(Boolean);
// garis masa (saat)
const CAKE_DY = 0.42;  // kek dinaikkan sedikit supaya di tengah ruang kosong
const T = { cake0: 0.3, cakeBuild: 3.2, light: 3.7, text0: 4.6, blow: 10.2, dis0: 11.0, disDur: 1.6, flower0: 11.6,
            ayat0: 15.4 };                       // ayat mula muncul bila bunga hampir mekar
const LOOP = +QS.get("loop") || 20;            // semua gerakan berulang tepat setiap LOOP saat (?loop=15)
const TAU = 2 * Math.PI, W_ = TAU / LOOP;
const GROW_SECONDS = 7, SPIN_SPEED = W_, TILT = 0.40, SEED = 2026;
const CAM = 7, Y_OFF = 0.70, BASE_Y = -1.30, LEVELS = 14;
const LIGHT = unit([-0.35, 0.55, -0.75]);

const PAL = {
  rose_red: [[170, 0, 30], [255, 40, 70]],      rose_pink: [[220, 30, 120], [255, 120, 180]],
  cosmos: [[230, 40, 150], [255, 140, 210]],    white: [[225, 225, 245], [255, 255, 255]],
  sun: [[255, 140, 0], [255, 215, 0]],          orange: [[255, 90, 0], [255, 160, 40]],
  purple: [[110, 40, 220], [170, 110, 255]],    lilac: [[160, 90, 235], [210, 170, 255]],
  lavender: [[120, 70, 230], [160, 120, 255]],  blue: [[30, 100, 250], [90, 170, 255]],
  t_red: [[210, 0, 30], [255, 60, 60]],         t_yellow: [[255, 190, 0], [255, 235, 60]],
  t_pink: [[245, 60, 140], [255, 150, 200]],    gold: [[255, 175, 0], [255, 210, 40]],
  brown: [[100, 45, 10], [150, 80, 20]],        stem: [[60, 160, 70], [100, 210, 100]],
  leaf: [[20, 130, 50], [70, 200, 80]],         wrap: [[235, 175, 195], [250, 210, 222]],
  ribbon: [[225, 20, 110], [255, 70, 150]],     bwhite: [[240, 240, 255], [255, 255, 255]],
  // kek
  sponge: [[240, 120, 170], [255, 185, 210]],   sponge2: [[170, 120, 240], [215, 185, 255]],
  cream: [[255, 240, 225], [255, 252, 245]],    plate: [[150, 160, 200], [225, 230, 250]],
  berry: [[200, 0, 40], [255, 60, 80]],         candle1: [[70, 160, 255], [160, 215, 255]],
  candle2: [[255, 200, 60], [255, 240, 160]],   candle3: [[120, 220, 140], [190, 250, 200]],
  flame: [[255, 90, 0], [255, 240, 140]],       wick: [[60, 40, 30], [90, 70, 50]],
};
const K_SURF = 0, K_STEM = 1, K_LEAF = 2, K_WRAP = 3, K_DOT = 4, K_CENTER = 5, K_FLAME = 6;
const RAMPS = { 0: ".:-=+oO0@", 2: ".,-~=+*", 3: ".,:;=+*#", 5: ".:*#%@" };

// ---------------------------------------------------------------- warna
const shadeIndex = new Map(), SHADES = [], SHADES_BG = [];   // warna aksara & warna latar sel
function shadeId(rgb) {
  const key = rgb.map(Math.round).join(",");
  if (!shadeIndex.has(key)) {
    const row = [], brow = [], css = c => `rgb(${c.map(v => Math.max(0, Math.min(255, Math.round(v)))).join(",")})`;
    for (let L = 0; L < LEVELS; L++) {
      const e = L / (LEVELS - 1);
      let c = rgb.map(v => v * (0.55 + 0.6 * e));
      if (e > 0.9) { const m = (e - 0.9) * 1.5; c = c.map(v => v + (255 - v) * m); }
      row.push(css(c));
      brow.push(css(rgb.map(v => v * (0.2 + 0.5 * e))));
    }
    shadeIndex.set(key, SHADES.length);
    SHADES.push(row); SHADES_BG.push(brow);
  }
  return shadeIndex.get(key);
}
const mix = (a, b, s) => [0, 1, 2].map(i => a[i] + (b[i] - a[i]) * s);

// ------------------------------------------------------------ matematik 3D
function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function unit(a) { const n = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / n, a[1] / n, a[2] / n]; }
function cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function frameOf(axis) {
  const helper = Math.abs(axis[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
  const u = unit(cross(helper, axis));
  return [u, cross(axis, u)];
}
function frange(a, b, step) {
  const n = Math.max(1, Math.round((b - a) / step)), out = [];
  for (let i = 0; i <= n; i++) out.push(a + (b - a) * i / n);
  return out;
}
function bezier(a, c, b, s) { const m = 1 - s; return [0,1,2].map(i => m*m*a[i] + 2*m*s*c[i] + s*s*b[i]); }
function bezierTan(a, c, b, s) { return unit([0,1,2].map(i => 2*(1-s)*(c[i]-a[i]) + 2*s*(b[i]-c[i]))); }
function dist(a, b) { return Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]); }
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// ---------------------------------------------------------------- pembina
function buildScene(h, spread) {
  const R = rng(SEED), uni = (a, b) => a + (b - a) * R(), pick = s => s[Math.floor(R() * s.length)];
  const randint = (a, b) => a + Math.floor(R() * (b - a + 1));
  const pts = [];
  let obj = 0;
  const nu = () => { obj++; };      // id objek baru (untuk garis pemisah)
  const put = (p, n, kind, pal, s, appear, phase = null, ch = " ", tone = 1) => {
    const sway = phase === null ? 0 : 0.014 * Math.max(0, p[1] - BASE_Y) ** 2;
    const sid = shadeId(mix(PAL[pal][0], PAL[pal][1], Math.round(s * 4) / 4));
    pts.push([p[0], p[1], p[2], n[0], n[1], n[2], kind, sid, ch, Math.min(appear, 0.99), sway, phase || 0, tone, obj]);
  };
  const stem = (a, c, b, t0, t1, phase, pal = "stem") => {
    nu();
    const L = dist(a, c) + dist(c, b);
    for (const s of frange(0, 1, h / L)) put(bezier(a, c, b, s), bezierTan(a, c, b, s), K_STEM, pal, s, t0 + (t1 - t0) * s, phase);
  };
  const leaf = (base, out, length, width, appear, phase) => {
    nu();
    const ld = unit(add(out, [0, 0.8, 0])), side = unit(cross(ld, [0, 1, 0])), nrm = unit(cross(side, ld));
    for (const a of frange(0, 1, h / length)) {
      const hw = width * Math.sin(Math.PI * a) ** 0.7;
      const centre = add(add(base, mul(ld, a * length)), [0, -0.35 * length * a * a, 0]);
      for (const b of (hw > h * 0.5 ? frange(-hw, hw, h) : [0]))
        put(add(add(centre, mul(side, b)), mul(nrm, Math.abs(b) * 0.6)), nrm, K_LEAF, "leaf", a, appear + 0.12 * a, phase, " ",
            hw > 0 ? 1 - 0.45 * (Math.abs(b) / hw) ** 2 : 1);
    }
  };
  const daisy = (c, axis, Rd, petals, pal, cpal, appear, phase, centre = 0.28, cup = 0.3) => {
    const [u, w] = frameOf(axis), rc = Rd * centre;
    nu();
    for (const r of frange(0, rc, h)) {
      const n = Math.floor(2 * Math.PI * r / h) + 1;
      for (let j = 0; j < n; j++) {
        const th = 2 * Math.PI * j / n, rad = add(mul(u, Math.cos(th)), mul(w, Math.sin(th)));
        const p = add(add(c, mul(rad, r)), mul(axis, rc * 0.6 * (1 - (r / rc) ** 2)));
        put(p, unit(add(axis, mul(rad, r / rc))), K_CENTER, cpal, r / rc, appear, phase, " ", 0.75 + 0.25 * Math.cos(th * 9 + r * 60) ** 2);
      }
    }
    const off = uni(0, Math.PI), half = Math.PI / petals * 0.8, r0 = rc * 0.7;
    for (let k = 0; k < petals; k++) {
      const a0 = off + 2 * Math.PI * k / petals;
      nu();
      for (const r of frange(r0, Rd, h * 0.75)) {
        const s = (r - r0) / (Rd - r0);
        const wid = half * Math.sin(Math.PI * (0.08 + 0.92 * s)) ** 0.5;
        const n = Math.floor(r * wid / h * 1.3);
        for (let j = -n; j <= n; j++) {
          const th = a0 + (n ? wid * j / n : 0), rad = add(mul(u, Math.cos(th)), mul(w, Math.sin(th)));
          put(add(add(c, mul(rad, r)), mul(axis, Rd * cup * s * s)), unit(add(axis, mul(rad, -0.6 * s))),
              K_SURF, pal, s, appear + 0.25 * s, phase, " ", 1 - 0.5 * (n ? Math.abs(j / n) : 0) ** 3);
        }
      }
    }
  };
  const rose = (c, axis, Rr, pal, appear, phase) => {
    const [u, w] = frameOf(axis), thmax = 2 * Math.PI * 3.3, off = uni(0, 2 * Math.PI);
    nu();
    let th = 0.6;
    while (th < thmax) {
      const s = th / thmax, r = Rr * s;
      const Hh = Rr * 0.62 * (1 - 0.4 * s) * (0.82 + 0.18 * Math.cos(th * 1.7));
      const rad = add(mul(u, Math.cos(th + off)), mul(w, Math.sin(th + off)));
      for (const v of frange(0, Hh, h)) {
        const f = (v / Hh) ** 2 * 0.3 * Rr * s;
        put(add(add(c, mul(rad, r + f)), mul(axis, v - 0.15 * Rr)), unit(add(rad, mul(axis, -0.5 * f / Rr))),
            K_SURF, pal, s, appear + 0.25 * s, phase, " ", 0.45 + 0.55 * (v / Hh) ** 1.5);
      }
      th += h / Math.max(r, 0.03) * 0.9;
    }
    for (const r of frange(0, Rr, h)) {
      const n = Math.floor(2 * Math.PI * r / h) + 1;
      for (let j = 0; j < n; j++) {
        const t2 = 2 * Math.PI * j / n, rad = add(mul(u, Math.cos(t2)), mul(w, Math.sin(t2)));
        put(add(add(c, mul(rad, r)), mul(axis, -0.15 * Rr)), axis, K_SURF, pal, 0, appear, phase, " ", 0.4);
      }
    }
  };
  const tulip = (c, axis, Rt, pal, appear, phase) => {
    const [u, w] = frameOf(axis), H = Rt * 1.5, off = uni(0, Math.PI);
    nu();
    for (const v of frange(0, 1, h / H)) {
      const r = Rt * (0.25 + 0.75 * Math.sin(Math.PI * (0.1 + 0.6 * v)));
      const n = Math.floor(2 * Math.PI * r / h) + 3;
      for (let j = 0; j < n; j++) {
        const th = 2 * Math.PI * j / n;
        const lobe = Math.abs(Math.cos(1.5 * (th - off)));
        if (v > 0.78 + 0.22 * lobe) continue;
        const rad = add(mul(u, Math.cos(th)), mul(w, Math.sin(th)));
        put(add(add(c, mul(rad, r)), mul(axis, v * H)), unit(add(rad, mul(axis, -0.3))), K_SURF, pal, v, appear + 0.2 * v, phase,
            " ", 0.55 + 0.45 * Math.sqrt(lobe));
      }
    }
  };
  const lavender = (c, axis, L, pal, appear, phase) => {
    const [u, w] = frameOf(axis), steps = Math.max(4, Math.floor(L / (h * 1.4)));
    nu();
    for (let i = 0; i <= steps; i++) {
      const v = i / steps, r = 0.065 * (1 - 0.55 * v);
      for (let j = 0; j < 7; j++) {
        const th = 2 * Math.PI * j / 7 + v * 7, rad = add(mul(u, Math.cos(th)), mul(w, Math.sin(th)));
        put(add(add(c, mul(axis, v * L)), mul(rad, r)), rad, K_DOT, pal, v, appear + 0.2 * v, phase, pick("oO0@"));
      }
    }
  };
  const babysBreath = (c, axis, appear, phase) => {
    nu();
    const nb = randint(6, 9);
    for (let b = 0; b < nb; b++) {
      const d = unit(add(axis, [uni(-0.9, 0.9), uni(-0.3, 0.6), uni(-0.9, 0.9)]));
      const end = add(c, mul(d, uni(0.1, 0.24)));
      stem(c, add(c, mul(d, 0.05)), end, appear, appear + 0.05, phase);
      const nd = randint(3, 5);
      for (let k = 0; k < nd; k++)
        put(add(end, [uni(-0.05, 0.05), uni(-0.02, 0.05), uni(-0.05, 0.05)]), d, K_DOT, "bwhite", 1, appear + 0.1, phase, pick("oo*."));
    }
  };
  const wrapping = () => {
    const y0 = -1.75, y1 = -0.72, r0 = 0.07, r1 = 0.66, H = y1 - y0, slope = (r1 - r0) / H, opening = Math.PI / 2;
    nu();
    for (const v of frange(0, 1.07, h / (H * 1.15))) {
      const y = y0 + v * H, r = r0 + (r1 - r0) * v, n = Math.floor(2 * Math.PI * r / h) + 4;
      for (let j = 0; j < n; j++) {
        const th = 2 * Math.PI * j / n;
        const gap = Math.abs((((th - opening + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) - Math.PI);
        if (gap < 0.65 * v || y > y1 + 0.08 * Math.sin(6 * th)) continue;
        put([Math.cos(th) * r, y, Math.sin(th) * r], unit([Math.cos(th), -slope, Math.sin(th)]), K_WRAP, "wrap", v, 0.15 * v);
      }
    }
    nu();
    const yr = -1.38, rr = r0 + (r1 - r0) * (yr - y0) / H + 0.015;
    for (const y of frange(yr - 0.045, yr + 0.045, h)) {
      const n = Math.floor(2 * Math.PI * rr / h) + 4;
      for (let j = 0; j < n; j++) { const th = 2 * Math.PI * j / n, rad = [Math.cos(th), 0, Math.sin(th)];
        put([rad[0] * rr, y, rad[2] * rr], rad, K_SURF, "ribbon", 0.5, 0.2); }
    }
    const front = -Math.PI / 2, rad = [Math.cos(front), 0, Math.sin(front)], tan = [-Math.sin(front), 0, Math.cos(front)];
    const kn = mul(rad, rr + 0.02), knot = [kn[0], yr, kn[2]], nl = Math.floor(2 * Math.PI * 0.1 / h) + 6;
    for (const side of [-1, 1]) {
      for (const lw of frange(-0.025, 0.025, h))
        for (let k = 0; k < nl; k++) { const a = 2 * Math.PI * k / nl;
          const p = add(knot, add(mul(tan, side * (0.1 + 0.1 * Math.cos(a))), [0, 0.06 * Math.sin(a) + lw, 0]));
          put(add(p, mul(rad, 0.03)), rad, K_SURF, "ribbon", 1, 0.22); }
      for (const s of frange(0, 1, h / 0.3)) {
        const p = add(knot, add(mul(tan, side * 0.09 * s), [0, -0.3 * s, 0]));
        put(add(p, mul(rad, 0.03)), rad, K_SURF, "ribbon", 0.5, 0.22); }
    }
    for (let k = 0; k < 7; k++) { const a = 2 * Math.PI * k / 7;
      for (const y of frange(-2.05, BASE_Y, h)) put([0.035 * Math.cos(a), y, 0.035 * Math.sin(a)], [0, 1, 0], K_STEM, "stem", 0, 0.05); }
  };

  const FLOWERS = [
    ["rose", "rose_red"], ["sunflower", "sun"], ["daisy", "cosmos"], ["tulip", "t_red"], ["lavender", "lavender"],
    ["rose", "rose_pink"], ["daisy", "white"], ["daisy", "orange"], ["aster", "purple"], ["tulip", "t_pink"],
    ["rose", "rose_red"], ["lavender", "blue"], ["daisy", "cosmos"], ["tulip", "t_yellow"], ["aster", "lilac"],
    ["rose", "rose_pink"], ["daisy", "white"],
  ];
  const base = [0, BASE_Y, 0], golden = Math.PI * (3 - Math.sqrt(5));
  wrapping();
  const stalk = (el, az, d0, tHead) => {
    const d = [Math.sin(el) * Math.cos(az), Math.cos(el), Math.sin(el) * Math.sin(az)];
    const head = add(base, mul(d, d0)), sb = add(base, [uni(-0.04, 0.04), 0, uni(-0.04, 0.04)]);
    const ctrl = [sb[0] + d[0] * d0 * 0.3, sb[1] + d[1] * d0 * 0.65, sb[2] + d[2] * d0 * 0.3];
    const phase = uni(0, 2 * Math.PI);
    stem(sb, ctrl, head, 0.03 + 0.12 * R(), tHead, phase);
    return { d, head, axis: unit(add(mul(d, 0.8), [0, 1, 0])), phase, curve: [sb, ctrl, head] };
  };
  const n = FLOWERS.length;
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1), el = (3 + (spread - 3) * Math.sqrt(f)) * Math.PI / 180;
    const az = i * golden + uni(-0.2, 0.2), tHead = 0.5 + 0.2 * R();
    const s = stalk(el, az, uni(2.05, 2.35) - 0.3 * f, tHead);
    const nLeaves = R() < 0.5 ? 2 : 1;
    for (let q = 0; q < nLeaves; q++) {
      const sp = uni(0.3, 0.6);
      let out = el > 0.2 ? unit([s.d[0], 0, s.d[2]]) : [Math.cos(az), 0, Math.sin(az)];
      out = unit(add(out, [uni(-0.6, 0.6), 0, uni(-0.6, 0.6)]));
      leaf(bezier(...s.curve, sp), out, uni(0.32, 0.46), 0.08, tHead * sp + 0.05, s.phase);
    }
    const [kind, pal] = FLOWERS[i];
    if (kind === "sunflower") daisy(s.head, s.axis, 0.36, 20, pal, "brown", tHead, s.phase, 0.45, 0.2);
    else if (kind === "daisy") daisy(s.head, s.axis, uni(0.25, 0.3), pick([8, 10, 12]), pal, pal === "orange" ? "brown" : "gold", tHead, s.phase);
    else if (kind === "aster") daisy(s.head, s.axis, uni(0.22, 0.26), 16, pal, "gold", tHead, s.phase, 0.3);

    }
  // tulisan "Selamat Hari Lahir": ditaip baris demi baris, berkilau pelangi
  const tdis = clamp((t - T.dis0) / 1.3);                      // tulisan larut bersama kek
  if (tdis < 1) for (const [i, li, xf, edge, r] of textCells) {
    const p = clamp((t - T.text0 - li * 1.5) / 1.3);
    if (p <= 0 || xf > p || r < tdis) continue;
    if (tdis > 0 && r < tdis + 0.08) { chars[i] = "*"; colors[i] = "#fff3c4"; bgs[i] = null; continue; }
    const front = p < 1 && xf > p - 0.07;
    const k = Math.floor(((xf * 0.55 + li * 0.2 + t * 0.18) % 1) * 48);
    chars[i] = edge ? "@" : "#";
    colors[i] = front ? "#ffffff" : TXT_FG[k];
    bgs[i] = front ? "#ffe0f4" : edge ? TXT_FG[k] : TXT_BG[k];
  }

  for (const [sx, sy, ph, sp] of stars) {                       // bintang berkelip
    const i = sy * cols + sx;
    if (chars[i] !== " ") continue;
    const b = Math.sin(t * sp + ph);
    if (b > 0.25) { chars[i] = b > 0.9 ? "*" : b > 0.7 ? "+" : "."; colors[i] = b > 0.9 ? "#fffbe0" : b > 0.7 ? "#d8d4a8" : "#6e6c96"; }
  }
  if (g >= 1) for (const p of petals) {                         // kelopak gugur (berulang setiap LOOP)
    const sy = Math.floor(((p[1] + p[2] * t / LOOP) % 1) * (rows + 2)) - 1;
    const sx = Math.floor(p[0] + Math.sin(p[6] * W_ * t + p[3]) * 3);
    if (sx >= 0 && sx < cols && sy >= 0 && sy < rows) { chars[sy * cols + sx] = p[4]; colors[sy * cols + sx] = p[5]; }
  }

  // 1) aksara ke lapisan txt
  tctx.clearRect(0, 0, W, H);
  tctx.font = V.font; tctx.textBaseline = "top";
  let cur = null;
  for (let i = 0; i < size; i++) {                              // isi warna padu sel
    const b = bgs[i];
    if (!b) continue;
    if (b !== cur) { cur = b; tctx.fillStyle = b; }
    tctx.fillRect(ox + (i % cols) * cw, oy + ((i / cols) | 0) * lh, cw + 0.6, lh + 0.6);
  }
  cur = null;
  for (let i = 0; i < size; i++) {
    const ch = chars[i];
    if (ch === " ") continue;
    if (colors[i] !== cur) { cur = colors[i]; tctx.fillStyle = cur; }
    tctx.fillText(ch, ox + (i % cols) * cw, oy + ((i / cols) | 0) * lh);
  }
  // 2) latar + glow + aksara
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.drawImage(bg, 0, 0, W, H);
  gctx.clearRect(0, 0, glow.width, glow.height);
  gctx.drawImage(txt, 0, 0, glow.width, glow.height);
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.4;
  ctx.drawImage(glow, 0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.drawImage(txt, 0, 0, W, H);

  // 3) hati terapung (selepas mekar)
  if (g >= 1) {
    const a = clamp((t - T.flower0 - GROW_SECONDS) / 2);
    ctx.globalCompositeOperation = "lighter";
    for (const h of hearts) {
      const hy = H + 30 - ((h[1] + h[2] * t / LOOP) % 1) * (H + 70);
      const fade = Math.min(1, hy / H * 2.2) * Math.min(1, (H - hy) / 120 + 0.2);
      ctx.globalAlpha = 0.35 * a * Math.max(0, fade);
      ctx.fillStyle = "#ff6fb5";
      ctx.font = `${h[4]}px sans-serif`;
      ctx.fillText("♥", h[0] + Math.sin(h[5] * W_ * t + h[3]) * 18, hy);
    }
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = "source-over";

  // 4) ayat lembut bersama bunga: perkataan muncul satu demi satu
  if (t > T.ayat0) {
    const fam = 'Georgia, "Palatino Linotype", "Book Antiqua", "Times New Roman", "DejaVu Serif", serif';
    let fsz = Math.min(H * 0.042, W * 0.09);
    ctx.font = `italic ${fsz}px ${fam}`;
    const wmax = Math.max(...AYAT.map(l => ctx.measureText(l).width));
    if (wmax > W * 0.86) { fsz *= W * 0.86 / wmax; ctx.font = `italic ${fsz}px ${fam}`; }
    const lineGap = fsz * 1.45, yMid = oy + V.topPad * lh * 0.5;
    const y0 = yMid - (AYAT.length - 1) * lineGap / 2;
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.shadowColor = "rgba(255,120,190,0.85)"; ctx.shadowBlur = fsz * 0.6;
    const space = ctx.measureText(" ").width;
    let w = 0;
    AYAT.forEach((line, li) => {
      const words = line.split(/\s+/);
      let x = (W - ctx.measureText(line).width) / 2;
      for (const word of words) {
        const a = smooth((t - T.ayat0 - w * 0.32) / 0.9);
        if (a > 0) {
          ctx.globalAlpha = a;
          ctx.fillStyle = "#ffe8f3";
          ctx.fillText(word, x, y0 + li * lineGap + (1 - a) * fsz * 0.35);
        }
        x += ctx.measureText(word).width + space;
        w++;
      }
    });
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  // 5) pesanan ditaip dengan cahaya
  const tMsg = T.flower0 + GROW_SECONDS * 0.85;
  if (MSG_ON && t > tMsg) {
    const shown = MESSAGE.slice(0, Math.floor((t - tMsg) * 14));
    let fs = Math.min(30, Math.max(15, W / 22));
    ctx.font = `600 ${fs}px ${FONT}`;
    let mw = ctx.measureText(MESSAGE).width;
    if (mw > W * 0.92) { fs *= W * 0.92 / mw; ctx.font = `600 ${fs}px ${FONT}`; mw = ctx.measureText(MESSAGE).width; }
    const y = Math.min(H - fs * 1.8, oy + (V.bottom + 1.5) * lh);
    let x = (W - mw) / 2;
    ctx.textBaseline = "top";
    ctx.shadowColor = "rgba(255,100,190,0.9)"; ctx.shadowBlur = 14;
    const wave = ["#ff8fd0", "#ffb3e0", "#ffd9f0", "#ffffff", "#ffd9f0", "#ffb3e0"];
    for (let j = 0; j < shown.length; j++) {
      ctx.fillStyle = wave[(j + Math.floor(t * 8)) % wave.length];
      ctx.fillText(shown[j], x, y);
      x += ctx.measureText(shown[j]).width;
    }
    ctx.shadowBlur = 0;
  }
  if (!CAPTURE) requestAnimationFrame(frame);
}

cv.addEventListener("pointerdown", e => { dragging = e.clientX; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if (dragging !== null) { dragAngle += (e.clientX - dragging) * 0.01; dragging = e.clientX; } });
cv.addEventListener("pointerup", () => { dragging = null; });
cv.addEventListener("dblclick", () => { if (started) t0 = performance.now(); });

// skrin hadiah: animasi bermula bila penerima menekan "Buka hadiah"
let started = CAPTURE || QS.has("terus");
const gift = document.getElementById("gift"), hint = document.getElementById("hint");
document.getElementById("giftFor").textContent = NAMA ? `Untuk ${NAMA}` : "";
if (started) gift.hidden = true;
document.getElementById("open").addEventListener("click", () => {
  started = true; t0 = performance.now();
  gift.classList.add("out");
  setTimeout(() => { gift.hidden = true; }, 750);
  hint.style.opacity = 1;
  setTimeout(() => { hint.style.opacity = 0; }, 5000);
});
if (CAPTURE) hint.style.display = "none";
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(setup, 150); });

setup();
if (CAPTURE) window.renderAt = t => frame(0, t);    // untuk rakaman video bingkai demi bingkai
else requestAnimationFrame(frame);
</script>
