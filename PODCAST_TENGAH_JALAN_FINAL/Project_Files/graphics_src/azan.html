<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"></head><body>
<script src="lib.js"></script>
<script>
// Azan section background: evening sky, mosque silhouette, slow clouds, soft sun. A transparent window
// (VX,VY,VW,VH) is left for the vertical azan video, composited underneath by the compositor.
const ctx = setup();
const Q = new URLSearchParams(location.search); const DUR=parseFloat(Q.get('dur')||'11');
const VX=1170, VY=110, VW=486, VH=864;  // 9:16 window
const R=rng(21);
const clouds=Array.from({length:7},(_,i)=>({x:R()*W, y:120+R()*380, s:.6+R()*.9, v:6+R()*10}));
function cloud(x,y,s,a){ ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='rgba(255,226,214,.55)'; ctx.translate(x,y); ctx.scale(s,s);
  ctx.beginPath(); ctx.moveTo(170,0); ctx.ellipse(0,0,170,28,0,0,6.28); ctx.moveTo(170,-22); ctx.ellipse(70,-22,100,30,0,0,6.28); ctx.moveTo(20,-12); ctx.ellipse(-60,-12,80,22,0,0,6.28); ctx.fill(); ctx.restore(); }
function mosque(x,base,s){ ctx.save(); ctx.translate(x,base); ctx.scale(s,s); ctx.fillStyle='#24101C';
  ctx.fillRect(-260,-150,520,150);                               // hall
  ctx.beginPath(); ctx.moveTo(-150,-150); ctx.bezierCurveTo(-150,-330,150,-330,150,-150); ctx.fill();   // main dome
  ctx.fillRect(-6,-345,12,40); ctx.beginPath(); ctx.arc(0,-352,10,0,6.28); ctx.fill();
  for(const dx of [-220,220]){ ctx.beginPath(); ctx.moveTo(dx-55,-150); ctx.bezierCurveTo(dx-55,-230,dx+55,-230,dx+55,-150); ctx.fill(); }
  for(const mx of [-330,330]){ ctx.fillRect(mx-18,-420,36,420); ctx.beginPath(); ctx.moveTo(mx-26,-420); ctx.lineTo(mx,-480); ctx.lineTo(mx+26,-420); ctx.fill(); ctx.fillRect(mx-28,-300,56,10); }
  // arches (warm light)
  ctx.fillStyle='rgba(255,200,130,.55)'; for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(i*70-18,-10); ctx.lineTo(i*70-18,-70); ctx.arc(i*70,-70,18,Math.PI,0); ctx.lineTo(i*70+18,-10); ctx.fill(); }
  ctx.restore(); }
window.draw = t=>{
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H); ctx.globalAlpha=1;
  const z=1+0.03*(t/DUR);
  ctx.save(); ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-W/2,-H/2);
  let g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2B2246'); g.addColorStop(.4,'#7B3F63'); g.addColorStop(.7,'#E08A7A'); g.addColorStop(.88,'#F5B57C'); g.addColorStop(1,'#F8CB93');
  ctx.fillStyle=g; ctx.fillRect(-50,-50,W+100,H+100);
  const sx=560, sy=820; const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,520); sg.addColorStop(0,'rgba(255,238,200,.95)'); sg.addColorStop(.1,'rgba(255,214,160,.8)'); sg.addColorStop(.35,'rgba(255,170,120,.25)'); sg.addColorStop(1,'rgba(255,150,120,0)');
  ctx.fillStyle=sg; ctx.fillRect(-50,-50,W+100,H+100);
  for(const c of clouds){ cloud(((c.x + c.v*t) % (W+400))-200, c.y, c.s, .8); }
  // ground + mosque silhouette (left side, behind text)
  mosque(560, 1000, 0.95);
  ctx.fillStyle='#1C0C16'; ctx.fillRect(-50,1000,W+100,120);
  // palm silhouettes
  ctx.restore();
  // soft dark gradient left for text legibility
  g=ctx.createLinearGradient(0,0,1100,0); g.addColorStop(0,'rgba(20,6,14,.55)'); g.addColorStop(1,'rgba(20,6,14,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,1100,H);
  // text
  const a1=win(t,.3,DUR-.5,.8,.6);
  ctx.globalAlpha=a1; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  if('letterSpacing' in ctx) ctx.letterSpacing='6px';
  ctx.font=font(600,26); ctx.fillStyle='rgba(255,230,210,.9)'; ctx.fillText('SERUAN AZAN',130,330+(1-ease.out(prog(t,.3,1.1)))*20);
  if('letterSpacing' in ctx) ctx.letterSpacing='0px';
  ctx.fillStyle=C.pink; ctx.fillRect(130,352,70*ease.out(prog(t,.5,1.3)),3);
  ctx.font=font(700,62); ctx.fillStyle='#FFF4EA';
  ctx.globalAlpha=a1*ease.out(prog(t,.5,1.3)); ctx.fillText('Berhenti Sebentar,',130,450);
  ctx.globalAlpha=a1*ease.out(prog(t,.8,1.6)); ctx.font=font(500,54); ctx.fillText('Menghayati Seruan Ilahi.',130,530);
  ctx.globalAlpha=1;
  // video window frame (shadow + border); the window itself stays transparent
  const wa=ease.out(prog(t,.7,1.4))*(1-ease.inOut(prog(t,DUR-.7,DUR)));
  ctx.save(); ctx.globalAlpha=wa;
  ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=40; ctx.shadowOffsetY=14; ctx.fillStyle='rgba(0,0,0,1)';
  rrect(ctx,VX,VY,VW,VH,26); ctx.fill(); ctx.shadowColor='transparent';
  ctx.globalCompositeOperation='destination-out'; rrect(ctx,VX,VY,VW,VH,26); ctx.fill(); ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='rgba(255,236,220,.85)'; ctx.lineWidth=4; rrect(ctx,VX-2,VY-2,VW+4,VH+4,28); ctx.stroke();
  ctx.restore();
  // global fades handled by compositor
};
fontsReady().then(()=>{ window.READY=true; });
</script></body></html>
