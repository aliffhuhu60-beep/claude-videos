<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"></head><body>
<script src="lib.js"></script>
<script>
const ctx = setup();
const Q = new URLSearchParams(location.search);
const ID = Q.get('id'); const DUR = parseFloat(Q.get('dur')||'8'); const CUES = (Q.get('cues')||'').split(',').filter(x=>x!=='').map(parseFloat);
const LINES = (Q.get('lines')||'').split('|');
// panel geometry (matches compositor split layout)
const PX=1180, PY=150, PW=690, PH=619;
const INK='#2A161B', MUTED='#7A5A60';
const cue=(k)=> k===0?0:(CUES[k-1]!==undefined?CUES[k-1]:1e9);   // stage k appears at cue k (stage0 at 0)
const st=(t,k,d=.45)=>ease.out(prog(t,cue(k),cue(k)+d));

// --- rich text: *maroon bold*  ~pink chip~  !strike!  ^yellow chip^
function parse(s){ const out=[]; let re=/(\*[^*]+\*|~[^~]+~|%[^%]+%|\^[^^]+\^)/g, last=0, m;
  while((m=re.exec(s))){ if(m.index>last) out.push({t:s.slice(last,m.index),k:'n'}); const c=m[0][0]; out.push({t:m[0].slice(1,-1),k:{'*':'b','~':'p','%':'x','^':'y'}[c]}); last=m.index+m[0].length; }
  if(last<s.length) out.push({t:s.slice(last),k:'n'}); return out; }
function rich(s,x,y,maxW,size,opts={}){
  const lh=opts.lh||size*1.38, w0=opts.weight||500, col=opts.color||INK, align=opts.align||'left';
  // tokenise into words carrying style
  const toks=[]; for(const sg of parse(s)){ const parts=sg.t.split(/(\s+)/); for(const p of parts){ if(p==='') continue; toks.push({t:p,k:sg.k}); } }
  const fontFor=k=> font(k==='b'||k==='p'||k==='y'?700:w0,size);
  // group consecutive non-space tokens into words so punctuation never wraps alone
  const groups=[]; for(const tk of toks){ ctx.font=fontFor(tk.k); const w=ctx.measureText(tk.t).width; const sp=/^\s+$/.test(tk.t);
    if(sp) groups.push({sp:true,items:[{...tk,w}],w}); else { const g=groups[groups.length-1]; if(g&&!g.sp) { g.items.push({...tk,w}); g.w+=w; } else groups.push({sp:false,items:[{...tk,w}],w}); } }
  const lines=[[]]; let lw=0;
  for(const g of groups){ if(g.sp){ if(lines[lines.length-1].length){ lines[lines.length-1].push(...g.items); lw+=g.w; } continue; }
    if(lw+g.w>maxW && lines[lines.length-1].length){ const L=lines[lines.length-1]; while(L.length&&/^\s+$/.test(L[L.length-1].t)) L.pop(); lines.push([]); lw=0; }
    lines[lines.length-1].push(...g.items); lw+=g.w; }
  ctx.textBaseline='alphabetic';
  lines.forEach((L,i)=>{ const tot=L.reduce((a,b)=>a+b.w,0); let cx= align==='center'? x-tot/2 : x; const yy=y+i*lh;
    for(const tk of L){ ctx.font=fontFor(tk.k);
      if(tk.k==='p'||tk.k==='y'){ ctx.fillStyle= tk.k==='p'? C.pink : C.yellow; rrect(ctx,cx-4,yy-size*0.95,tk.w+8,size*1.25,8); ctx.fill(); ctx.fillStyle=INK; }
      else ctx.fillStyle= tk.k==='b'? C.maroon : (tk.k==='x'? '#A0525E' : col);
      ctx.fillText(tk.t,cx,yy);
      if(tk.k==='x'){ ctx.strokeStyle='#C0392B'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx,yy-size*.32); ctx.lineTo(cx+tk.w,yy-size*.32); ctx.stroke(); }
      cx+=tk.w; } });
  return lines.length*lh;
}
function card(alpha){ // main panel card
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=30; ctx.shadowOffsetY=10;
  ctx.fillStyle=C.cream; rrect(ctx,PX,PY,PW,PH,26); ctx.fill(); ctx.restore();
}
function header(txt,sub,a){ ctx.save(); ctx.globalAlpha=a;
  ctx.fillStyle=C.maroon; rrect(ctx,PX+34,PY+34,10,40,5); ctx.fill();
  ctx.font=font(700,30); ctx.fillStyle=C.maroon; ctx.textBaseline='alphabetic'; if('letterSpacing' in ctx) ctx.letterSpacing='3px';
  ctx.fillText(txt,PX+60,PY+66); if('letterSpacing' in ctx) ctx.letterSpacing='0px';
  if(sub){ ctx.font=font(500,20); ctx.fillStyle=MUTED; ctx.textAlign='right'; ctx.fillText(sub,PX+PW-34,PY+64); ctx.textAlign='left'; }
  ctx.fillStyle='rgba(110,30,43,.15)'; ctx.fillRect(PX+34,PY+92,PW-68,2);
  ctx.restore(); }
function chip(x,y,w,h,txt,bg,fg,size=30,a=1,sub){ ctx.save(); ctx.globalAlpha*=a; ctx.fillStyle=bg; rrect(ctx,x,y,w,h,16); ctx.fill();
  ctx.fillStyle=fg; ctx.font=font(800,size); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,x+w/2,y+h/2+(sub?-12:2));
  if(sub){ ctx.font=font(500,17); ctx.globalAlpha*=.9; ctx.fillText(sub,x+w/2,y+h/2+22); }
  ctx.restore(); }
function tag(x,y,txt,bg,fg,size=20){ ctx.font=font(700,size); const w=ctx.measureText(txt).width+28; ctx.fillStyle=bg; rrect(ctx,x,y,w,size+16,(size+16)/2); ctx.fill(); ctx.fillStyle=fg; ctx.textBaseline='middle'; ctx.fillText(txt,x+14,y+(size+16)/2+1); ctx.textBaseline='alphabetic'; return w; }
function mark(x,y,ok,a=1){ ctx.save(); ctx.globalAlpha*=a; ctx.fillStyle= ok? '#2E7D4F' : '#C0392B'; ctx.beginPath(); ctx.arc(x,y,17,0,6.28); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.beginPath();
  if(ok){ ctx.moveTo(x-8,y); ctx.lineTo(x-2,y+7); ctx.lineTo(x+9,y-7); } else { ctx.moveTo(x-7,y-7); ctx.lineTo(x+7,y+7); ctx.moveTo(x+7,y-7); ctx.lineTo(x-7,y+7); }
  ctx.stroke(); ctx.restore(); }
function arrowDown(x,y,len,a){ ctx.save(); ctx.globalAlpha*=a; ctx.strokeStyle=C.maroon; ctx.fillStyle=C.maroon; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+len); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x-8,y+len-10); ctx.lineTo(x+8,y+len-10); ctx.lineTo(x,y+len+2); ctx.closePath(); ctx.fill(); ctx.restore(); }
function arrowRight(x,y,len,a){ ctx.save(); ctx.globalAlpha*=a; ctx.strokeStyle=C.maroon; ctx.fillStyle=C.maroon; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+len,y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+len-10,y-8); ctx.lineTo(x+len-10,y+8); ctx.lineTo(x+len+2,y); ctx.closePath(); ctx.fill(); ctx.restore(); }
function fadeUp(t,k,fn){ const p=st(t,k); if(p<=0) return; ctx.save(); ctx.globalAlpha*=p; ctx.translate(0,(1-p)*18); fn(); ctx.restore(); }
function tiktokCard(x,y,w,txt,label,a,size=34){ // dark social caption card
  ctx.save(); ctx.globalAlpha*=a;
  const h = 64 + 30 + measureRich(txt,w-60,size);
  ctx.fillStyle='#17121A'; rrect(ctx,x,y,w,h,22); ctx.fill();
  ctx.fillStyle=C.pink; ctx.beginPath(); ctx.arc(x+44,y+42,16,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font=font(600,20); ctx.fillText(label,x+72,y+49);
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font=font(500,18); ctx.textAlign='right'; ctx.fillText('@pengguna · contoh',x+w-28,y+49); ctx.textAlign='left';
  rich(txt,x+30,y+64+size+4,w-60,size,{color:'#fff',weight:600});
  ctx.restore(); return h; }
function measureRich(txt,maxW,size){ ctx.save(); ctx.globalAlpha=0; const h=rich(txt,0,-1000,maxW,size); ctx.restore(); return h; }

window.draw = (t)=>{
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H); ctx.globalAlpha=1;
  const a = Math.min(ease.out(prog(t,0,.5)), 1-ease.inOut(prog(t,DUR-.4,DUR)));
  if(a<=0) return;
  ctx.save(); ctx.translate((1-ease.out(prog(t,0,.55)))*60,0); ctx.globalAlpha=a;
  card(1); ctx.globalAlpha=a;
  P[ID](t);
  ctx.restore();
};
