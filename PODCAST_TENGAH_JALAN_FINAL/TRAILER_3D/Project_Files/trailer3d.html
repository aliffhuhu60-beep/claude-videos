// ---------------- animation data ----------------
let ENV=null;  // injected by the renderer
const CLIPS=[['AL',2.8,7.82],['AM',8.1,10.98],['IM',11.15,14.87],['AL',16.4,23.58],['AM',23.7,27.08]];
const speakerAt=t=>{ for(const c of CLIPS) if(t>=c[1]&&t<c[2]) return c[0]; return null; };
function envAt(k,t){ if(!ENV) return 0; const f=Math.min(ENV.env[k].length-1,Math.max(0,Math.round(t*FPS))); return ENV.env[k][f]; }
function smooth(k,t){ let s=0,w=0; for(let d=-3;d<=3;d++){ const ww=4-Math.abs(d); s+=envAt(k,t+d/FPS)*ww; w+=ww; } return s/w; }

function animateHosts(t){
  const spk=speakerAt(t); const laugh=ENV? ENV.env.laugh[Math.min(ENV.env.laugh.length-1,Math.round(t*FPS))]:0;
  for(const [k,h] of Object.entries(HOST)){
    const o=h.o; const e=envAt(k,t), es=smooth(k,t); const phase={AL:0,IM:1.7,AM:3.1}[k];
    // breathing + idle sway
    h.torso.rotation.z=Math.sin(t*0.9+phase)*0.012; h.torso.position.y=0.06+Math.sin(t*1.8+phase)*0.003;
    // laughter
    const L=laugh*(0.6+0.4*Math.abs(Math.sin(t*14+phase)));
    h.torso.rotation.x=-0.04 - L*0.07; h.pelvis.position.y=0.5+L*0.012*Math.abs(Math.sin(t*16+phase));
    // gaze: speaker looks at others / camera; listeners look at the speaker
    let target=0;
    if(spk && spk!==k){ const a=HOST[spk].root.position, b=h.root.position; target=Math.atan2(a.x-b.x, a.z-b.z+1.2)-h.root.rotation.y; target=clamp(target,-0.7,0.7); }
    else if(spk===k){ target=Math.sin(t*0.7+phase)*0.25 - h.root.rotation.y*0.6; }
    else target=-h.root.rotation.y*0.5 + Math.sin(t*0.4+phase)*0.1;
    h.look += (target-h.look)*0.18; h.head.rotation.y=h.look;
    h.head.rotation.x = -0.03 + (spk===k? es*0.08*Math.sin(t*7+phase):0) - L*0.12 + Math.sin(t*1.1+phase)*0.01;
    h.head.rotation.z = Math.sin(t*0.8+phase)*0.03 + (spk===k? es*0.04*Math.sin(t*3.3):0);
    // mouth
    const open = spk===k ? Math.pow(e,0.8) : 0; const lo=Math.max(open, L*0.75);
    h.mouth.scale.set(1.15 - lo*0.2 + (L>0?0.25:0), 0.12+lo*0.8, 0.22); h.mouth.position.y=-0.064 - lo*0.008; 
    // blink
    const bl = ((t*1000+phase*977)%3700) < 110 ? 0.1 : 1; for(const ey of h.eyes) ey.scale.y=0.85*bl; for(const p of h.pupils) p.visible = bl>0.5;
    // arms: rest on thighs; gesture while speaking
    h.arms.forEach((a,i)=>{ const g = spk===k ? clamp(es*1.2)*(i===1?0.6:0.3) : 0; const wav=Math.sin(t*4.2+phase+i)*0.12*g;
      a.sh.rotation.x = -0.55 - g*0.25 + wav*0.3; a.sh.rotation.z = a.sx*(0.12 + g*0.1);
      a.el.rotation.x = -0.65 - g*0.55 + wav; a.el.rotation.z = -a.sx*g*0.35; });
  }
}

// ---------------- camera rig ----------------
function headPos(k){ const v=new THREE.Vector3(); HOST[k].head.getWorldPosition(v); return v; }
function shotCU(k,t,t0,dur,side=0.0,dist=1.25,push=0.12){ const h=headPos(k); const r=HOST[k].root.rotation.y; const p=(t-t0)/dur;
  const d=dist-push*ease.inOut(p); const ang=r+side; camera.position.set(h.x+Math.sin(ang)*d, h.y+0.02, h.z+Math.cos(ang)*d);
  camera.lookAt(h.x, h.y-0.06, h.z); camera.fov=30; }
function shotWide(t,t0,dur,from,to,look){ const p=ease.inOut((t-t0)/dur); camera.position.set(lerp(from[0],to[0],p),lerp(from[1],to[1],p),lerp(from[2],to[2],p)); camera.lookAt(look[0],look[1],look[2]); camera.fov=35; }

function frame(t){
  const phone = t<2.4;
  world.visible=!phone; phoneG.visible=phone; sky.visible=!phone;
  scene.background = phone? new THREE.Color('#1b0710') : null; scene.fog = phone? null : scene.fog || new THREE.Fog('#d9dfe6',30,140);
  skyMat.uniforms.warm.value = clamp((t-24)/5)*0.8;
  sun.color.set(t>24? '#ffd2a0':'#ffe1b5');
  animateHosts(t);
  cards.forEach(c=>c.visible=false);
  if(phone){ drawPhone(prog(t,0.25,1.65)); phoneG.position.set(0,0,0); phoneG.rotation.set(-0.06+Math.sin(t*1.3)*0.03, -0.28+t*0.12, 0.04);
    camera.position.set(0,0.0, lerp(3.0,2.55,ease.out(t/2.4))); camera.lookAt(0,0,0); camera.fov=35; }
  else if(t<4.4) shotWide(t,2.4,2.0,[3.5,6.5,10],[1.4,1.5,5.0],[0,0.9,0]);
  else if(t<7.9) shotCU('AL',t,4.4,3.5,0.25,1.35,0.18);
  else if(t<11.1) shotCU('AM',t,7.9,3.2,-0.2,1.3,0.12);
  else if(t<14.9) shotCU('IM',t,11.1,3.8,0.12,1.3,0.15);
  else if(t<16.4){ const p=(t-14.9)/1.5; const a=-0.9+p*1.6; camera.position.set(Math.sin(a)*2.6-0.2, 1.05+p*0.3, Math.cos(a)*2.6+0.5); camera.lookAt(-0.2,0.95,0.3); camera.fov=40;
    cards.forEach((c,i)=>{ const st=14.9+i*0.5; if(t>=st){ c.visible=true; const q=ease.outBack(prog(t,st,st+0.3)); c.scale.setScalar(q); const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); const right=new THREE.Vector3().crossVectors(fwd,camera.up).normalize(); c.position.copy(camera.position).addScaledVector(fwd,2.2).addScaledVector(right,(i-1)*0.62).addScaledVector(camera.up,-0.28+0.03*Math.sin(t*3+i)); c.scale.multiplyScalar(0.75); c.lookAt(camera.position); } }); }
  else if(t<19.6) shotCU('AL',t,16.4,3.2,0.45,1.5,0.15);
  else if(t<23.5) shotWide(t,19.6,3.9,[-0.2,1.3,4.4],[-0.15,1.2,3.6],[-0.05,0.95,0.2]);
  else if(t<27.1) shotCU('AM',t,23.5,3.6,-0.35,1.35,0.25);
  else shotWide(t,27.1,2.5,[0.2,1.4,4.2],[0.6,3.4,9.5],[0,1.0,0]);
  camera.updateProjectionMatrix();
  renderer.render(scene,camera);
  drawOverlay(t);
}

function subText(s,y){ ov.font=font(800,60); ov.textBaseline='alphabetic'; const parts=[]; let re=/(\*[^*]+\*|~[^~]+~)/g,last=0,m;
  while((m=re.exec(s))){ if(m.index>last) parts.push([s.slice(last,m.index),'#fff']); parts.push([m[0].slice(1,-1), m[0][0]==='*'?C.yellow:C.pink]); last=m.index+m[0].length; }
  if(last<s.length) parts.push([s.slice(last),'#fff']);
  const w=parts.reduce((a,p)=>a+ov.measureText(p[0]).width,0); let x=960-w/2;
  for(const [tx,c] of parts){ ov.lineJoin='round'; ov.lineWidth=10; ov.strokeStyle='rgba(0,0,0,.9)'; ov.strokeText(tx,x,y); ov.fillStyle=c; ov.fillText(tx,x,y); x+=ov.measureText(tx).width; } }
function slam(txt,t,t0,dur,y,size,col,bg){ const a=win(t,t0,t0+dur,.12,.3); if(a<=0) return; const p=ease.outBack(prog(t,t0,t0+.28));

function drawOverlay(t){

    ov.fillStyle=C.maroon; rrect(ov,80,780,ov.measureText?360:360,70,12); ov.font=font(800,40); const w=Math.max(ov.measureText(name).width, (ov.font=font(500,24), ov.measureText(role).width))+60;

    ov.font=font(800,38); ov.fillStyle=C.cream; ov.fillText(name,110,835); ov.fillStyle=C.cream; rrect(ov,80,858,w*0.82,38,10); ov.fill();
    ov.font=font(600,22); ov.fillStyle=C.maroon; ov.fillText(role,98,884); ov.restore(); };
  chip('ALIFF','Hos Utama',4.5); chip('AMMAR','Suara Warganet',8.0); chip('IMAN','Detektif Sintaksis',11.2);
  // end card
  if(t>=27.1){ const a=ease.out(prog(t,27.25,27.85)); ov.globalAlpha=a*0.55; ov.fillStyle='#22070D'; ov.fillRect(0,0,1920,1080); ov.globalAlpha=a; ov.textAlign='center';

    const segs=[{t:'SLAY',c:C.pink},{t:' ATAU ',c:C.cream},{t:'SALAH?',c:'#fff'}]; drawSegs(ov,segs,0,0,'center'); ov.restore();
    ov.globalAlpha=a*ease.out(prog(t,27.8,28.3)); ov.textAlign='center'; ov.font=font(500,40); ov.fillStyle='rgba(247,237,224,.92)'; ov.fillText('Bila Bahasa Kita Terpaling Rancu di TikTok',960,690);
    ov.globalAlpha=a*ease.out(prog(t,28.1,28.5)); ov.fillStyle=C.yellow; rrect(ov,960-300,750,600,76,38); ov.fill(); ov.fillStyle='#141012'; ov.font=font(800,34); ov.fillText('EPISOD PENUH · TONTON SEKARANG',960,800);

  // fades
  const fo = Math.max(1-ease.out(prog(t,0,0.3)), ease.inOut(prog(t,TOTAL-0.5,TOTAL)), t>2.32&&t<2.48 ? 1-Math.abs(t-2.4)/0.08 : 0);

}
